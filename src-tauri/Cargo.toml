[package]
name = "airlab"
version = "0.1.0"
description = "Parametric printable ball generator"
authors = ["AirLab"]
edition = "2021"

[lib]
name = "airlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
